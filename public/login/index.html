<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Entrar - Gastos</title>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff,#fdf2f8);padding:16px}
  .box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:26px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(79,70,229,.12)}
  h1{margin:0 0 16px;font-size:1.3rem} label{font-size:.8rem;color:#6b7280;display:block;margin-bottom:4px}
  input{width:100%;padding:11px;border:1px solid #e5e7eb;border-radius:8px;font-size:16px}
  input:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.18)}
  button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.6} #erro{color:#dc2626;font-size:.85rem;min-height:1.2em;margin-top:10px}
</style>
</head>
<body>
<div class="box">
  <h1>💸 Dashboard de Gastos</h1>
  <form id="f">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required autofocus>
    <button id="b" type="submit">Entrar</button>
    <div id="erro" role="alert"></div>
  </form>
</div>
<script src="/login/login.js"></script>
</body>
</html>
