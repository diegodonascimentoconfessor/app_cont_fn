<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Gastos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --txt:#1f2937; --mut:#6b7280; --pri:#4f46e5; --bor:#e5e7eb; --red:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:20px 24px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:1.4rem; }
  main { max-width:1100px; margin:0 auto; padding:0 16px 40px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  .card { background:var(--card); border:1px solid var(--bor); border-radius:12px; padding:18px; }
  .full { grid-column:1/-1; }
  .total { font-size:2rem; font-weight:700; color:var(--pri); }
  label { font-size:.8rem; color:var(--mut); display:block; margin-bottom:4px; }
  select { padding:9px; border:1px solid var(--bor); border-radius:8px; font-size:.95rem; background:#fff; }
  input { width:100%; padding:9px; border:1px solid var(--bor); border-radius:8px; font-size:.95rem; }
  form { display:grid; gap:10px; grid-template-columns:2fr 1fr 1fr 1fr auto; align-items:end; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--pri); color:#fff; cursor:pointer; font-size:.9rem; }
  button.sec { background:#e5e7eb; color:var(--txt); }
  button.del { background:transparent; color:var(--red); padding:4px 8px; }
  button.edit { background:transparent; color:var(--pri); padding:4px 8px; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th,td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--bor); }
  th { color:var(--mut); font-weight:600; font-size:.8rem; }
  td.v { text-align:right; white-space:nowrap; }
  .cat { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--bor); }
  .vazio { color:var(--mut); text-align:center; padding:16px; }
  .chart-box { height:260px; position:relative; }
  html { -webkit-text-size-adjust:100%; }
  main > * { min-width:0; }
  select, input, button { font-family:inherit; }
  .acoes { display:flex; gap:8px; align-items:end; flex-wrap:wrap; }
  @media (max-width:800px){ main{grid-template-columns:1fr;} form{grid-template-columns:1fr 1fr;} #descricao-box{grid-column:1/-1;} }
  @media (max-width:600px){
    header { padding:14px 12px; }
    h1 { font-size:1.2rem; }
    main { padding:0 12px 28px; gap:12px; }
    .card { padding:14px; }
    .acoes { width:100%; }
    .acoes > div { flex:1 1 140px; }
    .acoes select { width:100%; }
    input, select, button { font-size:16px; min-height:42px; } /* evita zoom no iOS e melhora o toque */
    form { grid-template-columns:1fr; }
    form > div:last-child { width:100%; }
    form > div:last-child button { flex:1; }
    .total { font-size:1.7rem; }
    .chart-box { height:230px; }
    table, thead, tbody, tr, td { display:block; width:100%; }
    thead { display:none; }
    tr { border:1px solid var(--bor); border-radius:10px; padding:8px 10px; margin-bottom:10px; }
    td { border:0; padding:3px 0; text-align:left !important; display:flex; justify-content:space-between; gap:10px; }
    td::before { content:attr(data-label); color:var(--mut); font-size:.8rem; }
    td.v:last-child { justify-content:flex-end; gap:6px; padding-top:6px; }
    td.v:last-child::before { content:none; }
    td.v:last-child button { border:1px solid var(--bor); padding:8px 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>💸 Dashboard de Gastos</h1>
  <div class="acoes">
    <div><label for="cliente">Cliente</label><select id="cliente"></select></div>
    <button class="sec" id="novoCliente" title="Novo cliente">+ Novo</button>
    <button class="sec" id="renomear" title="Renomear cliente">✏️</button>
    <button class="sec" id="excluirCliente" title="Excluir cliente">🗑️</button>
    <div><label for="mes">Mês</label><input type="month" id="mes"></div>
    <button class="sec" id="todos">Todos</button>
    <button id="csv">Exportar CSV</button>
  </div>
</header>
<main>
  <section class="card full">
    <form id="form">
      <input type="hidden" id="id">
      <div id="descricao-box"><label>Descrição</label><input id="descricao" required placeholder="Ex.: Mercado"></div>
      <div><label>Categoria</label><input id="categoria" required list="cats" placeholder="Alimentação"><datalist id="cats"></datalist></div>
      <div><label>Valor (R$)</label><input id="valor" type="number" step="0.01" min="0.01" required></div>
      <div><label>Data</label><input id="data" type="date" required></div>
      <div style="display:flex;gap:6px"><button type="submit" id="salvar">Adicionar</button><button type="button" class="sec" id="cancelar" hidden>Cancelar</button></div>
    </form>
  </section>

  <section class="card">
    <div style="color:var(--mut);font-size:.85rem">Total no período</div>
    <div class="total" id="total">R$ 0,00</div>
    <div id="categorias" style="margin-top:12px"></div>
  </section>

  <section class="card"><div class="chart-box"><canvas id="grafico"></canvas></div></section>

  <section class="card full">
    <table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th style="text-align:right">Valor</th><th></th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
    <div class="vazio" id="vazio" hidden>Nenhum gasto neste período.</div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
